<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线答题</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ... 您之前的反馈区美化CSS保持不变 ... */
        .feedback-container { margin-top: 20px; border-radius: 8px; padding: 20px; }
        .feedback-panel { border-left-width: 5px; border-left-style: solid; padding: 15px; border-radius: 8px; background-color: #f8f9fa; }
        .feedback-wrong { border-left-color: #e74c3c; }
        .feedback-correct { border-left-color: #2ecc71; }
        .feedback-panel h3 { margin-top: 0; display: flex; align-items: center; }
        .feedback-panel .fas { margin-right: 10px; font-size: 1.2em; }
        .next-question-btn { display: block; width: 100%; margin-top: 20px; padding: 12px; font-size: 1.1em; }

        /* ▼▼▼ 新增的 AI 聊天界面样式 ▼▼▼ */
        #ai-chat-container {
            margin-top: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
        }
        #ai-chat-log {
            height: 250px;
            overflow-y: auto;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .chat-message {
            margin-bottom: 15px;
            display: flex;
        }
        .chat-message .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #ddd;
            text-align: center;
            line-height: 30px;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .chat-message .message-content {
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 10px;
            max-width: 85%;
        }
        .chat-message.user-message .message-content {
            background-color: #dcf8c6;
        }
        #ai-chat-input-area {
            display: flex;
            padding: 10px;
        }
        #ai-chat-input {
            flex-grow: 1;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 8px 15px;
            margin-right: 10px;
        }
        #ai-chat-send-btn {
            border-radius: 50%;
            width: 40px;
            height: 40px;
            border: none;
            background-color: #4a90e2;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>在线答题</h1>
        <div id="quiz-container">
            <div id="feedback-container" class="feedback-container" style="display: none;">
                <div id="feedback-wrong" class="feedback-panel feedback-wrong" style="display: none;">
                    <h3><i class="fas fa-times-circle"></i> 回答错误</h3>
                    <p>正确答案是：<strong id="correct-answer-text"></strong></p>
                    <p>关联知识点：<em id="related-keypoint"></em></p>
                    <button id="get-ai-analysis-btn">与 AI 老师对话解析</button>
                    
                    <div id="ai-chat-container" style="display: none;">
                        <div id="ai-chat-log">
                            </div>
                        <div id="ai-chat-input-area">
                            <input type="text" id="ai-chat-input" placeholder="针对这道题继续提问...">
                            <button id="ai-chat-send-btn"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                    <div id="recommendation-container" style="display: none; margin-top: 15px;">
                        </div>
                </div>
                <div id="feedback-correct" class="feedback-panel feedback-correct" style="display: none;">
                    </div>
                <button id="next-question-btn" class="next-question-btn">下一题</button>
            </div>
        </div>
        <div id="quiz-complete-container" style="display: none;">
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/main.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
