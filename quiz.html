<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线答题</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .feedback-container {
            margin-top: 20px;
            border-radius: 8px;
            padding: 20px;
        }
        .feedback-panel {
            border-left-width: 5px;
            border-left-style: solid;
            padding: 15px;
            border-radius: 8px;
            background-color: #f8f9fa;
        }
        .feedback-wrong {
            border-left-color: #e74c3c; /* 红色代表错误 */
        }
        .feedback-correct {
            border-left-color: #2ecc71; /* 绿色代表正确 */
        }
        .feedback-panel h3 {
            margin-top: 0;
            display: flex;
            align-items: center;
        }
        .feedback-panel .fas {
            margin-right: 10px;
            font-size: 1.2em;
        }
        .next-question-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            font-size: 1.1em;
        }
    </style>


</head>
<body>
    <div class="container">
        <h1>在线答题</h1>
        
        <div id="quiz-container">
            <div class="detail-card">
                <h3>问题 <span id="question-number"></span></h3>
                <p id="question-text">正在加载题目...</p>
            </div>
            
            <div class="answer-area">
                <textarea id="user-answer-input" placeholder="请在此输入你的答案..."></textarea>
                <button id="submit-answer-btn">提交答案</button>
            </div>

            <div id="feedback-container" class="feedback-container" style="display: none;">
                <div id="feedback-wrong" class="feedback-panel feedback-wrong" style="display: none;">
                    <h3><i class="fas fa-times-circle"></i> 回答错误</h3>
                    <p>正确答案是：<strong id="correct-answer-text"></strong></p>
                    <p>关联知识点：<em id="related-keypoint"></em></p>
                    <button id="get-ai-analysis-btn">请求 AI 智能解析</button>
                    <div id="ai-analysis-container" style="display: none; margin-top: 15px;">
                        <h4><i class="fas fa-robot"></i> AI 智能解析</h4>
                        <p id="ai-analysis-text">正在思考中...</p>
                    </div>
                    <div id="recommendation-container" style="display: none; margin-top: 15px;">
                        <h4><i class="fas fa-lightbulb"></i> 智能推荐</h4>
                        <p id="recommendation-text">正在为你寻找巩固题...</p>
                    </div>
                </div>
                <div id="feedback-correct" class="feedback-panel feedback-correct" style="display: none;">
                    <h3><i class="fas fa-check-circle"></i> 回答正确！</h3>
                    <p>太棒了，知识点掌握得很扎实！</p>
                </div>
                <button id="next-question-btn" class="next-question-btn">下一题</button>
            </div>
        </div>

        <div id="quiz-complete-container" style="display: none;">
            <h2>🎉 恭喜你，已完成所有题目！</h2>
            <a href="index.html" class="btn-back">返回主页</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/main.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
