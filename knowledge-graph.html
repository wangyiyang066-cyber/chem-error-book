<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态知识图谱</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* 新的左右布局 */
        .editor-layout {
            display: flex;
            gap: 20px;
        }
        .editor-main {
            flex-grow: 1;
        }
        .toolbox {
            width: 280px;
            flex-shrink: 0;
            background-color: #f1f3f5;
            border-radius: 8px;
            padding: 15px;
        }
        .toolbox h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1em;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        /* 元素周期表样式 */
        .periodic-table {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
        }
        .periodic-table span {
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            border: 1px solid #ccc;
            border-radius: 2px;
            font-size: 0.8em;
            cursor: pointer;
            height: 24px;
        }
        .periodic-table span:hover {
            background-color: #e0e0e0;
        }
        /* 符号面板样式 */
        .symbol-palette {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .symbol-palette button {
            font-size: 1.2em;
            width: 40px;
            height: 40px;
            cursor: pointer;
        }

        /* 画板和节点样式 (和之前一样) */
        #drawflow { width: 100%; height: 70vh; /* ... 其他样式 ... */ }
        /* ... 其他所有之前的样式都请保留 ... */
    </style>
</head>
<body>
    <div class="container">
        <h1>动态知识图谱 (专业版)</h1>
        <p>点击右侧工具箱中的元素或符号，即可添加到选中的卡片中。</p>
        
        <div class="editor-layout">

            <div class="editor-main">
                <div class="palette">
                    </div>
                <div id="drawflow" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
            </div>

            <div class="toolbox">
                <h3>元素周期表 (部分)</h3>
                <div class="periodic-table">
                    <span data-element="H">H</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span data-element="He">He</span>
                    <span data-element="Li">Li</span><span data-element="Be">Be</span><span></span><span></span><span></span><span></span><span></span><span data-element="B">B</span><span data-element="C">C</span><span data-element="N">N</span>
                    <span data-element="O">O</span><span data-element="F">F</span><span data-element="Ne">Ne</span><span></span><span></span><span></span><span></span><span data-element="Na">Na</span><span data-element="Mg">Mg</span><span data-element="Al">Al</span>
                    <span data-element="Si">Si</span><span data-element="P">P</span><span data-element="S">S</span><span data-element="Cl">Cl</span><span data-element="Ar">Ar</span><span></span><span></span><span data-element="K">K</span><span data-element="Ca">Ca</span>
                </div>

                <h3>常用符号</h3>
                <div class="symbol-palette">
                    <button data-symbol="→">→</button>
                    <button data-symbol="⇌">⇌</button>
                    <button data-symbol="↑">↑</button>
                    <button data-symbol="↓">↓</button>
                    <button data-symbol="+">+</button>
                    <button data-symbol="=">=</button>
                </div>
            </div>
        </div>
        
        <a href="dashboard.html" class="btn-back" style="margin-top: 30px;">返回主面板</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/gh/jerosoler/Drawflow/dist/drawflow.min.js"></script>
    <script src="js/knowledge-graph.js"></script>
</body>
</html>
