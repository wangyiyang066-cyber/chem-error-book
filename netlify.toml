# netlify.toml

[dev]
  ignore = ["node_modules", ".venv"]

# --- [build] 部分：告诉 Netlify 你的云函数位置 ---
[build]
  functions = "netlify/functions"

# --- 合并后的环境变量配置 ---
[build.environment]
  NODE_VERSION = "18"
  # 关键新增：告诉 Netlify 扫描时跳过所有 .py 文件，解决你的构建报错
  SECRETS_SCAN_OMIT_PATHS = "*.py"

# --- 为 AI 函数设置超时 (绝不崩溃的安全写法) ---
[functions."get-ai-analysis"]
  timeout = 90

[functions."generate-diagnostic"]
  timeout = 60  # 🌟 给 DeepSeek 充足的 60 秒思考时间！

# --- Python 运行时配置 ---
[functions.python]
  runtime = "python"
  python_version = "3.12"