# netlify.toml

# --- 你原来的配置 (保留) ---
[dev]
  ignore = ["node_modules", ".venv"]

[build]
  functions = "netlify/functions"

[functions."get-ai-analysis"]
  timeout = 90

# --- 新增的配置 (推荐) ---
# 为所有 JS 函数设置一个默认的 Node.js 版本
[functions]
  node_version = "18"

# --- 新增的配置 (必需) ---
# 告诉 Netlify 如何处理 .py 文件
[functions.python]
  runtime = "python"
  # AgentScope 需要 Python 3.10+
  python_version = "3.12"