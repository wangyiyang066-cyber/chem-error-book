# ==========================================
# 🚀 终极版 netlify.toml (突破 10 秒限制)
# ==========================================

[dev]
  ignore = ["node_modules", ".venv"]

# --- [build] 部分：告诉 Netlify 你的云函数位置 ---
[build]
  functions = "netlify/functions"

# --- 环境变量配置 ---
[build.environment]
  NODE_VERSION = "18"
  # 告诉 Netlify 扫描时跳过所有 .py 文件，解决构建报错
  SECRETS_SCAN_OMIT_PATHS = "*.py"

# --- 全局函数配置 ---
[functions]
  node_bundler = "esbuild"

[functions."get-ai-analysis"]
  timeout = 90

[functions."generate-diagnostic"]
  timeout = 60  # 给诊断出题 60 秒思考时间

[functions."generate-plan"]
  timeout = 60  # 🚀 解决你刚才超时的核心：给生成计划 60 秒！

[functions."get-daily-quiz"]
  timeout = 60

# --- Python 运行时配置 ---
[functions.python]
  runtime = "python"
  python_version = "3.12"