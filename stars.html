                { id: "topic_10.2", title: "酸和碱的中和反应", full_code: "10.2", layer: 2, parent_id: "root_10" },

            // --- 11. 第十一单元 盐 化肥 ---
            { id: "root_11", title: "第十一单元 盐 化肥", full_code: "11", layer: 1, parent_id: null },
                { id: "topic_11.1", title: "生活中常见的盐", full_code: "11.1", layer: 2, parent_id: "root_11" },
                { id: "topic_11.2", title: "化学肥料", full_code: "11.2", layer: 2, parent_id: "root_11" },

            // --- 12. 第十二单元 化学与生活 ---
            { id: "root_12", title: "第十二单元 化学与生活", full_code: "12", layer: 1, parent_id: null },
                { id: "topic_12.1", title: "人类重要的营养物质", full_code: "12.1", layer: 2, parent_id: "root_12" },
                { id: "topic_12.2", title: "化学元素与人体健康", full_code: "12.2", layer: 2, parent_id: "root_12" },
                { id: "topic_12.3", title: "有机合成材料", full_code: "12.3", layer: 2, parent_id: "root_12" },

        // ==================================================================================
        async function initPage() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session) {
                    document.getElementById('user-email').innerText = session.user.email;
                    // 传入 Token 去获取数据库里的“孙子”节点
                    fetchAndMergeData(session.access_token); 
                } else {
                    alert("请先登录！");
                    window.location.href = 'index.html';
                }
            } catch (err) { console.error(err); }
        }

        async function fetchAndMergeData(token) {
            try {
                // 1. 获取数据库里的知识点 (小行星)
                const response = await fetch('/.netlify/functions/get-stars-data', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });
                
                let dbData = [];
                if (response.ok) {
                    dbData = await response.json();
                } else {
                    console.warn("数据库连接失败，将仅显示手动骨架");
                }

                // 2. 合并数据：手动骨架 + 数据库知识点
                const allData = [...MANUAL_NODES];

                // 处理数据库数据：
                // 关键点：数据库里的 parent_id 必须能对应上我们手动写的 id
                // 比如数据库里有一条 full_code="8.1.1", 它的 parent 应该是 "topic_8.1"
                
                dbData.forEach(item => {
                    // 这里做一个简单的自动挂载逻辑
                    // 假设数据库里的 item.parent_id 指向的是数据库原本的 id，这里可能连不上。
                    // 我们尝试通过 full_code 自动寻找爸爸。
                    // 例如：如果我是 "8.1.1"，我的爸爸应该是 full_code 为 "8.1" 的那个节点。
                    
                    let parentCode = "";
                    if (item.full_code && item.full_code.includes('.')) {
                        // 取倒数第二个点之前的部分作为父代码
                        // 8.1.1 -> 8.1
                        let parts = item.full_code.split('.');
                        if (parts.length > 2) {
                            parts.pop(); // 去掉最后一位
                            parentCode = parts.join('.');
                        }
                    }

                    // 在 MANUAL_NODES 里找爸爸
                    let parentNode = MANUAL_NODES.find(n => n.full_code === parentCode);
                    
                    if (parentNode) {
                        // 找到了爸爸！修改 parent_id 指向手动节点
                        item.parent_id = parentNode.id;
                        item.layer = 3; // 强制设为知识点层级
                        allData.push(item);
                    } else {
                        // 没找到爸爸？可能它是孤立的，或者它自己就是大单元
                        // 暂时也加进去，防止数据丢失
                        item.layer = 3;
                        allData.push(item);
                    }
                });

                document.getElementById('loading').style.display = 'none';
                renderChart(allData);

            } catch (err) {
                document.getElementById('loading').innerHTML = `<span style="color:#e74c3c">${err.message}</span>`;
            }
        }

        function renderChart(nodesData) {
            var dom = document.getElementById('container');
            var myChart = echarts.init(dom, 'dark');

            var nodes = [];
            var links = [];
            
            var categories = [
                {name: "单元 (Unit)", itemStyle: {color: '#f1c40f', borderColor: '#fff', borderWidth: 2}},
                {name: "课题 (Topic)", itemStyle: {color: '#3498db'}}, 
                {name: "知识点 (Point)", itemStyle: {color: '#e74c3c'}}
            ];

            nodesData.forEach(item => {
                // 样式处理
                let size = 15;
                let categoryIdx = 2;
                let labelShow = false;

                if (item.layer === 1) { // 单元
                    size = 70; 
                    categoryIdx = 0;
                    labelShow = true;
                } else if (item.layer === 2) { // 课题
                    size = 35; 
                    categoryIdx = 1;
                } else { // 知识点
                    size = 15;
                    categoryIdx = 2;
                }

                nodes.push({
                    id: String(item.id),
                    name: item.title, 
                    value: item.full_code,
                    extraContent: item.content || "无详细描述",
                    symbolSize: size,
                    category: categoryIdx,
                    draggable: true,
                    label: { show: labelShow, fontSize: 12 }
                });

                if (item.parent_id) {
                    links.push({
                        source: String(item.parent_id),
                        target: String(item.id)
                    });
                }
            });

            var option = {
                backgroundColor: '#0b0f19',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.dataType === 'node') {
                            return `
                                <div class="star-tooltip">
                                    <div class="tooltip-title">${params.data.value} ${params.data.name}</div>
                                    <div class="tooltip-content">${params.data.extraContent.substring(0, 100)}...</div>
                                </div>
                            `;
                        }
                    },
                    backgroundColor: 'rgba(50,50,50,0.9)', borderColor: '#777', textStyle: { color: '#fff' }
                },
                legend: [{ data: categories.map(a => a.name), bottom: 20, textStyle: { color: '#ccc' } }],
                series: [{
                    type: 'graph',
                    layout: 'force',
                    data: nodes,
                    links: links,
                    categories: categories,
                    roam: true,
                    label: { position: 'right', formatter: '{b}' },
                    lineStyle: { color: 'source', curveness: 0.3, opacity: 0.7 },
                    force: { repulsion: 350, edgeLength: [40, 120] }
                }]
            };

            myChart.setOption(option);
            window.addEventListener('resize', myChart.resize);
        }

        initPage();
    </script>
