<!DOCTYPE html>
<html style="height: 100%">
<head>
    <meta charset="utf-8">
    <title>知识星空 - 化学错题管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; background-color: #0b0f19; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; }
        
        /* 顶部导航栏 */
        #navbar {
            position: absolute; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(11, 15, 25, 0.8); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .nav-title { color: #fff; font-size: 18px; font-weight: 500; letter-spacing: 1px; margin-left: 15px; }
        .btn-back { text-decoration: none; color: rgba(255,255,255,0.8); font-size: 20px; transition: color 0.3s; }
        .btn-back:hover { color: #f1c40f; }

        /* 加载动画 */
        #loading { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: #fff; font-size: 16px; display: flex; flex-direction: column; align-items: center; gap: 15px; 
            z-index: 200; pointer-events: none;
        }
        
        /* 核心：自定义悬浮卡片样式 */
        .star-tooltip { 
            max-width: 320px; 
            white-space: normal; /* 允许换行 */
            font-family: 'Noto Sans SC', sans-serif;
        }
        .tooltip-header {
            color: #f1c40f; 
            font-weight: bold; 
            font-size: 16px; 
            border-bottom: 1px solid rgba(255,255,255,0.2); 
            padding-bottom: 8px;
            margin-bottom: 8px;
        }
        .tooltip-body {
            color: #e0e0e0; 
            font-size: 13px; 
            line-height: 1.6;
            text-align: justify;
        }
        .tag-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            margin-right: 5px;
            color: #fff;
        }
        .tag-layer1 { background-color: #e67e22; }
        .tag-layer2 { background-color: #3498db; }
        .tag-layer3 { background-color: #27ae60; }
    </style>
</head>
<body style="height: 100%">

    <div id="navbar">
        <div style="display: flex; align-items: center;">
            <a href="dashboard.html" class="btn-back" title="返回"><i class="fas fa-arrow-left"></i></a>
            <div class="nav-title"><i class="fas fa-atom"></i> 初三化学 · 知识星空</div>
        </div>
        <div style="color: rgba(255,255,255,0.5); font-size: 12px;">Data Source: Supabase</div>
    </div>

    <div id="loading">
        <i class="fas fa-spinner fa-spin fa-2x" style="color: #3498db;"></i>
        <span id="loading-text">正在从云端拉取化学宇宙...</span>
    </div>

    <div id="container" style="height: 100%"></div>

    <script type="text/javascript">
        // 1. Supabase 配置
        const SUPABASE_URL = "https://ghuyiwhqdellucjxqiwj.supabase.co"; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdodXlpd2hxZGVsbHVjanhxaXdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc0MzQwOTQsImV4cCI6MjA3MzAxMDA5NH0.toJ68-C9Kq_GmD_pGiXLH5_TK7MhawdBsdCv1FP-TVk'; 
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. 主逻辑
        async function initGalaxy() {
            try {
                // 直接从数据库查 knowledge_nodes 表
                // 按照 full_code 排序，保证逻辑顺序
                const { data: nodesData, error } = await _supabase
                    .from('knowledge_nodes')
                    .select('*')
                    .order('full_code', { ascending: true });

                if (error) throw error;
                
                if (!nodesData || nodesData.length === 0) {
                    throw new Error("数据库是空的，请先运行 Python 脚本上传数据！");
                }

                document.getElementById('loading').style.display = 'none';
                renderChart(nodesData);

            } catch (err) {
                document.getElementById('loading').innerHTML = 
                    `<i class="fas fa-exclamation-triangle" style="color:#e74c3c"></i><span>${err.message}</span>`;
            }
        }

        function renderChart(dbData) {
            var dom = document.getElementById('container');
            var myChart = echarts.init(dom, 'dark');

            var nodes = [];
            var links = [];
            
            // 定义图例分类
            var categories = [
                {name: "单元 (Unit)", itemStyle: {color: '#e67e22'}},  // 橙色
                {name: "课题 (Topic)", itemStyle: {color: '#3498db'}}, // 蓝色
                {name: "知识点 (Point)", itemStyle: {color: '#2ecc71'}} // 绿色
            ];

            // 转换数据格式
            dbData.forEach(item => {
                let size = 10;
                let categoryIdx = 2;
                let labelShow = false;
                let layerName = "知识点";

                // 根据 Layer 决定节点外观
                if (item.layer === 1) { 
                    size = 60; categoryIdx = 0; labelShow = true; layerName = "Unit";
                } else if (item.layer === 2) { 
                    size = 25; categoryIdx = 1; labelShow = false; layerName = "Topic";
                } else { 
                    size = 12; categoryIdx = 2; labelShow = false; layerName = "Point";
                }

                // 添加节点
                nodes.push({
                    id: String(item.id),
                    name: item.title,
                    value: item.full_code, // ECharts value 字段，这里放编号
                    // 自定义数据，供 Tooltip 使用
                    extra: {
                        content: item.content,
                        layerName: layerName,
                        layer: item.layer
                    },
                    symbolSize: size,
                    category: categoryIdx,
                    draggable: true,
                    label: {
                        show: labelShow,
                        position: 'right',
                        formatter: '{b}' // 显示名称
                    }
                });

                // 添加连线 (如果有 parent_id)
                if (item.parent_id) {
                    links.push({
                        source: String(item.parent_id),
                        target: String(item.id),
                        lineStyle: {
                            color: 'source',
                            opacity: 0.6,
                            curveness: 0.1 // 微微弯曲，更有机
                        }
                    });
                }
            });

            var option = {
                backgroundColor: '#0b0f19',
                title: {
                    text: '', // 标题栏已经有了，这里留空
                    top: 'bottom', left: 'right'
                },
                tooltip: {
                    trigger: 'item',
                    enterable: true, // 允许鼠标进入 tooltip (如果需要复制文字)
                    confine: true,   // 限制在屏幕内
                    backgroundColor: 'rgba(30, 30, 40, 0.95)',
                    borderColor: '#444',
                    padding: 15,
                    borderRadius: 8,
                    textStyle: { color: '#fff' },
                    // 🔥 核心：自定义 Tooltip 内容
                    formatter: function (params) {
                        if (params.dataType === 'node') {
                            const data = params.data;
                            const content = data.extra.content || "暂无详细描述";
                            
                            // 徽章颜色
                            let badgeClass = 'tag-layer3';
                            if(data.extra.layer === 1) badgeClass = 'tag-layer1';
                            if(data.extra.layer === 2) badgeClass = 'tag-layer2';

                            return `
                                <div class="star-tooltip">
                                    <div class="tooltip-header">
                                        <span class="tag-badge ${badgeClass}">${data.value}</span>
                                        ${data.name}
                                    </div>
                                    <div class="tooltip-body">
                                        ${content}
                                    </div>
                                </div>
                            `;
                        }
                        return null; // 连线不显示 tooltip
                    }
                },
                legend: [{
                    data: categories.map(a => a.name),
                    bottom: 20,
                    right: 20,
                    textStyle: { color: '#ccc' },
                    orient: 'vertical' 
                }],
                series: [{
                    type: 'graph',
                    layout: 'force', // 力引导布局
                    data: nodes,
                    links: links,
                    categories: categories,
                    roam: true, // 允许缩放和平移
                    label: {
                        color: '#fff',
                        fontSize: 12
                    },
                    force: {
                        repulsion: 200,    // 斥力：越大节点分得越开
                        gravity: 0.1,      // 引力：越大节点越往中心聚
                        edgeLength: [30, 100], // 连线长度范围
                        layoutAnimation: true
                    },
                    emphasis: {
                        focus: 'adjacency', // 悬停时高亮相邻节点
                        lineStyle: { width: 4 }
                    }
                }]
            };

            myChart.setOption(option);

            // 监听窗口大小改变
            window.addEventListener('resize', function() {
                myChart.resize();
            });
            
            // 点击事件（预留：点击可以跳转到做题页面）
            myChart.on('click', function (params) {
                if (params.dataType === 'node') {
                    console.log("点击了节点:", params.data.name);
                    // 这里可以扩展：点击跳转到该知识点的错题列表
                    // window.location.href = `questions.html?kp_id=${params.data.id}`;
                }
            });
        }

        // 启动！
        initGalaxy();
    </script>
</body>
</html>
