<!DOCTYPE html>
<html style="height: 100%">
<head>
    <meta charset="utf-8">
    <title>知识星空 - 化学错题管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; background-color: #0b0f19; overflow: hidden; font-family: 'Noto Sans SC', sans-serif; }
        
        #navbar {
            position: absolute; top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .nav-title { color: #fff; font-size: 18px; font-weight: 500; letter-spacing: 1px; margin-left: 15px; }
        .btn-back-dashboard {
            text-decoration: none; color: rgba(255,255,255,0.8); font-size: 20px;
            transition: color 0.3s; display: flex; align-items: center;
        }
        .btn-back-dashboard:hover { color: #f1c40f; }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: #fff; font-size: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px;
        }

        /* 自定义 Tooltip 样式 (ECharts 会用 HTML渲染) */
        .star-tooltip {
            max-width: 300px;
            white-space: normal;
        }
        .tooltip-title { font-weight: bold; color: #f1c40f; font-size: 16px; margin-bottom: 5px; border-bottom: 1px solid #555; padding-bottom: 5px;}
        .tooltip-code { color: #aaa; font-size: 12px; margin-bottom: 8px; }
        .tooltip-content { color: #fff; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body style="height: 100%">

    <div id="navbar">
        <div style="display: flex; align-items: center;">
            <a href="dashboard.html" class="btn-back-dashboard" title="返回仪表盘"><i class="fas fa-arrow-left"></i></a>
            <div class="nav-title">🌌 初三化学 · 知识星空</div>
        </div>
        <div style="color: rgba(255,255,255,0.5); font-size: 14px;"><span id="user-email"></span></div>
    </div>

    <div id="loading"><i class="fas fa-spinner fa-spin"></i><span>正在扫描化学宇宙...</span></div>
    <div id="container" style="height: 100%"></div>

    <script type="text/javascript">
        // ⚠️ 依然只放 ANON KEY
        const SUPABASE_URL = "https://ghuyiwhqdellucjxqiwj.supabase.co"; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdodXlpd2hxZGVsbHVjanhxaXdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc0MzQwOTQsImV4cCI6MjA3MzAxMDA5NH0.toJ68-C9Kq_GmD_pGiXLH5_TK7MhawdBsdCv1FP-TVk'; 
        // ===========================================

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initPage() {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session) {
                    document.getElementById('user-email').innerText = session.user.email;
                    fetchDataFromFunction(session.access_token); 
                } else {
                    alert("请先登录！");
                    window.location.href = 'index.html';
                }
            } catch (err) { console.error(err); }
        }

        async function fetchDataFromFunction(token) {
            try {
                const response = await fetch('/.netlify/functions/get-stars-data', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });
                if (!response.ok) throw new Error(`Status: ${response.status}`);
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';
                renderChart(data);
            } catch (err) {
                document.getElementById('loading').innerHTML = `<span style="color:#e74c3c">${err.message}</span>`;
            }
        }

        function renderChart(dbData) {
            var dom = document.getElementById('container');
            var myChart = echarts.init(dom, 'dark');

            var nodes = [];
            var links = [];
            // 定义分类：0=单元(大), 1=课题(中), 2=知识点(小)
            var categories = [
                {name: "核心单元 (Units)", itemStyle: {color: '#f1c40f'}}, // 金黄色
                {name: "课题 (Topics)", itemStyle: {color: '#3498db'}},   // 蓝色
                {name: "知识点 (Points)", itemStyle: {color: '#e74c3c'}}, // 红色
                {name: "细节 (Details)", itemStyle: {color: '#95a5a6'}}   // 灰色
            ];

            dbData.forEach(item => {
                // 🧠【核心逻辑】根据 full_code 的点号数量来判断层级
                // "1" -> 0个点 -> Level 0 (Unit)
                // "2.1" -> 1个点 -> Level 1 (Topic)
                // "2.1.1" -> 2个点 -> Level 2 (Point)
                let code = item.full_code || "";
                let dotCount = (code.match(/\./g) || []).length;
                
                let categoryIndex = 0;
                let symbolSize = 10;
                let labelShow = false;

                if (dotCount === 0) { 
                    // 🌞 单元 (Unit 1, Unit 2...)
                    categoryIndex = 0; 
                    symbolSize = 80; // 巨大
                    labelShow = true; // 单元名默认显示
                } else if (dotCount === 1) {
                    // 🌍 课题 (Topic 2.1)
                    categoryIndex = 1; 
                    symbolSize = 40; // 中等
                } else if (dotCount === 2) {
                    // 🌕 知识点 (Point 2.1.1)
                    categoryIndex = 2; 
                    symbolSize = 20; // 小
                } else {
                    // ☄️ 更细的层级
                    categoryIndex = 3;
                    symbolSize = 10;
                }

                nodes.push({
                    id: String(item.id),
                    name: item.title, // 节点名字只显示标题，保持简洁
                    value: item.full_code,
                    // 把详细内容存到 data 里，给 Tooltip 用
                    extraContent: item.content || "暂无详细描述", 
                    symbolSize: symbolSize,
                    category: categoryIndex,
                    draggable: true,
                    label: { show: labelShow } // 只有大单元默认显示文字
                });

                if (item.parent_id) {
                    links.push({
                        source: String(item.parent_id),
                        target: String(item.id)
                    });
                }
            });

            var option = {
                backgroundColor: '#0b0f19',
                // 💡【悬停显示详情】
                tooltip: {
                    trigger: 'item',
                    enterable: true, // 允许鼠标移入 tooltip 复制文字
                    formatter: function (params) {
                        if (params.dataType === 'node') {
                            // 自定义 HTML 模板
                            return `
                                <div class="star-tooltip">
                                    <div class="tooltip-title">${params.data.name}</div>
                                    <div class="tooltip-code">Code: ${params.data.value}</div>
                                    <div class="tooltip-content">${params.data.extraContent.substring(0, 150)}${params.data.extraContent.length > 150 ? '...' : ''}</div>
                                </div>
                            `;
                        }
                        return params.name; // 连线的 tooltip
                    },
                    backgroundColor: 'rgba(50, 50, 50, 0.9)',
                    borderColor: '#777',
                    textStyle: { color: '#fff' }
                },
                legend: [{
                    data: categories.map(a => a.name),
                    bottom: 20,
                    textStyle: { color: '#ccc' }
                }],
                series: [{
                    type: 'graph',
                    layout: 'force',
                    data: nodes,
                    links: links,
                    categories: categories,
                    roam: true,
                    label: {
                        position: 'right',
                        formatter: '{b}'
                    },
                    emphasis: {
                        focus: 'adjacency',
                        scale: true, // 鼠标放上去变大
                        label: { show: true }
                    },
                    lineStyle: {
                        color: 'source',
                        curveness: 0.2, // 连线稍微弯曲一点，更有星空感
                        width: 1.5,
                        opacity: 0.6
                    },
                    force: {
                        repulsion: 400, // 斥力大一点，把星星推开
                        gravity: 0.1,
                        edgeLength: [50, 200] // 连线长度范围
                    }
                }]
            };

            myChart.setOption(option);
            window.addEventListener('resize', myChart.resize);
            
            // 🖱️ 点击事件：如果你想点击弹出更详细的窗口
            myChart.on('click', function (params) {
                if (params.dataType === 'node') {
                    console.log("Clicked:", params.name);
                    // 这里可以扩展：点击后弹出一个 Modal 显示完整 Markdown 笔记
                    // alert(params.data.extraContent); 
                }
            });
        }

        initPage();
    </script>
</body>
</html>
