<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录与注册 - 化学错题管理系统</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        html, body { height: 100%; }
        body { display: flex; justify-content: center; align-items: center; background-image: linear-gradient(135deg, #f4f7f9 0%, #d7e4ec 100%); }
        .auth-container { max-width: 420px; width: 100%; margin: 20px; padding: 40px; background: rgba(255, 255, 255, 0.9); border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); text-align: center; animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .project-title { font-size: 1.5em; font-weight: 500; color: #2c3e50; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #34495e; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px 15px; border-radius: 8px; border: 1px solid #bdc3c7; font-size: 1em; transition: all 0.3s ease; }
        .form-group input:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2); }
        .toggle-link { margin-top: 20px; }
        .toggle-link a { color: #3498db; text-decoration: none; font-weight: 500; }
        .toggle-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1 class="project-title">融合IRT与遗忘曲线的初三化学错题智能管理系统：基于元认知的视角</h1>
        
        <div id="signup-form-container" style="display: none;">
            <h2>注册新用户</h2>
            <form id="signup-form">
                <div class="form-group"><label for="signup-email">邮箱地址</label><input type="email" id="signup-email" required autocomplete="username"></div>
                <div class="form-group"><label for="signup-password">设置密码 (至少6位)</label><input type="password" id="signup-password" minlength="6" required autocomplete="new-password"></div>
                <button type="submit" class="btn-back" style="width:100%; padding:10px; background:#3498db; color:white; border:none; border-radius:5px; cursor:pointer;">立即注册</button>
            </form>
            <p class="toggle-link">已有账户？ <a href="#" id="show-login-link">点此登录</a></p>
        </div>

        <div id="login-form-container">
            <h2>用户登录</h2>
            <form id="login-form">
                <div class="form-group"><label for="login-email">邮箱地址</label><input type="email" id="login-email" required autocomplete="username"></div>
                <div class="form-group"><label for="login-password">输入密码</label><input type="password" id="login-password" required autocomplete="current-password"></div>
                <button type="submit" class="btn-back" style="width:100%; padding:10px; background:#3498db; color:white; border:none; border-radius:5px; cursor:pointer;">立即登录</button>
            </form>
            <p class="toggle-link">没有账户？ <a href="#" id="show-signup-link">点此注册</a></p>
        </div>

        <div id="message-display" class="detail-card" style="display: none; margin-top: 20px; color: red;"></div>
    </div>
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <script src="js/config.js"></script>
    
    <script src="js/auth-guard.js"></script>
    
    <script src="js/auth.js"></script>
</body>
</html>
